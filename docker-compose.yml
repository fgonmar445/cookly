services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cookly_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: cookly_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cookly
      MYSQL_USER: cookly_user
      MYSQL_PASSWORD: cookly_pwd
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
